name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compile and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt', 'project/**.scala', 'project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Check formatting
        run: sbt "scalafmtCheckAll; scalafmtSbtCheck"

      - name: Compile
        run: sbt Test/compile

      - name: Test
        run: sbt testFull

      - name: Compile examples and benchmarks
        run: sbt "examples / Compile / compile; benchmarks / Compile / compile"

      - name: Run examples
        shell: bash
        run: |
          mains="CatsEffect3Example ConsoleExample ContextualLoggingExample LogWithContextExample NamedTupleExample WithoutEffectsExample ZioExample"
          commands=$(printf 'examples/runMain logging4s.examples.%s; ' $mains)
          sbt --server -Dsbt.color=false "${commands%; }" | tee examples.log

          expect() {
            awk -v main="logging4s.examples.$1" '/^\[info\] running \(fork\) / { on = ($NF == main) } on' examples.log | grep -qF -- "$2" \
              || { echo "::error::$1 did not log: $2"; exit 1; }
          }

          expect CatsEffect3Example "delivery failed: class=java.lang.IllegalStateException"
          expect ConsoleExample "payment failed: class=java.lang.RuntimeException"
          expect ContextualLoggingExample "all requests handled"
          expect LogWithContextExample "A call-site value wins over the context"
          expect NamedTupleExample "cart totalled"
          expect WithoutEffectsExample "either logging succeeded: true"
          expect ZioExample "All users created"

      - name: Binary compatibility
        run: sbt mimaReportBinaryIssues
